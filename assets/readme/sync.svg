<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="432" viewBox="0 0 1200 432" role="img" aria-labelledby="title desc">
  <title id="title">How sync.sh moves files</title>
  <desc id="desc">sync.sh apply copies the layout, settings, keys and mods from this repo into ~/.config/herdr-app, moving each file it replaces into ~/.config/herdr-app.bak-time-pid beside the app folder. apply also fetches copy-on-select and the Catppuccin themes from GitHub at pinned commits, since they have no license to copy. sync.sh backup copies the same files from the app folder back into this repo.</desc>

  <defs>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
    <marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#60b9fc"/>
    </marker>
    <marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a6adc8"/>
    </marker>
  </defs>

  <rect width="1200" height="432" rx="24" fill="#11111b"/>

  <!-- This repo -->
  <g id="repo">
    <rect x="48" y="64" width="300" height="180" rx="12" fill="#1e2336" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="64" y="48" width="252" height="32" rx="7" fill="#60b9fc"/>
    <text class="m" x="76" y="71" font-size="20" font-weight="700" fill="#14151c">tkhwang-herdr-mods/</text>
    <g class="m" font-size="18" fill="#cdd6f4">
      <text x="68" y="122">layouts/main-dev.json</text>
      <text x="68" y="152">settings.json</text>
      <text x="68" y="182">keys.json</text>
      <text x="68" y="212">mods/ <tspan fill="#7f849c">10 mods</tspan></text>
    </g>
  </g>

  <!-- App folder -->
  <g id="app">
    <rect x="450" y="64" width="300" height="180" rx="12" fill="#1e2336" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="466" y="48" width="264" height="32" rx="7" fill="#60b9fc"/>
    <text class="m" x="478" y="71" font-size="20" font-weight="700" fill="#14151c">~/.config/herdr-app/</text>
    <g class="m" font-size="18" fill="#cdd6f4">
      <text x="470" y="122">layouts/main-dev.json</text>
      <text x="470" y="152">settings.json, keys.json</text>
      <text x="470" y="182">mods/ <tspan fill="#7f849c">+ copy-on-select</tspan></text>
      <text x="470" y="212">themes/ <tspan fill="#7f849c">Catppuccin</tspan></text>
    </g>
  </g>

  <!-- Backup folder for replaced files -->
  <g id="bak">
    <rect x="852" y="64" width="300" height="180" rx="12" fill="#181825" stroke="#ffffff" stroke-opacity="0.14" stroke-dasharray="6 5"/>
    <rect x="868" y="48" width="240" height="32" rx="7" fill="#11111b" stroke="#60b9fc" stroke-opacity="0.8"/>
    <text class="m" x="880" y="71" font-size="20" font-weight="700" fill="#60b9fc">.bak-&lt;time&gt;-&lt;pid&gt;/</text>
    <g class="m" font-size="18" fill="#a6adc8">
      <text x="872" y="122">files apply replaces</text>
      <text x="872" y="152">land here, beside the</text>
      <text x="872" y="182">app folder, so none</text>
      <text x="872" y="212">loads as a mod</text>
    </g>
  </g>

  <!-- Arrows between repo and app -->
  <text class="m" x="399" y="116" font-size="20" font-weight="700" fill="#60b9fc" text-anchor="middle">apply</text>
  <line x1="356" y1="130" x2="440" y2="130" stroke="#60b9fc" stroke-width="2.5" marker-end="url(#head-accent)"/>
  <text class="m" x="399" y="186" font-size="20" font-weight="700" fill="#a6adc8" text-anchor="middle">backup</text>
  <line x1="442" y1="200" x2="358" y2="200" stroke="#a6adc8" stroke-width="2.5" marker-end="url(#head-muted)"/>

  <!-- App to backup folder -->
  <text class="m" x="801" y="146" font-size="18" fill="#a6adc8" text-anchor="middle">replaced</text>
  <line x1="758" y1="160" x2="842" y2="160" stroke="#a6adc8" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#head-muted)"/>

  <!-- Pinned downloads -->
  <g id="github">
    <rect x="400" y="316" width="400" height="88" rx="12" fill="#181825" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="416" y="300" width="192" height="32" rx="7" fill="#11111b" stroke="#60b9fc" stroke-opacity="0.8"/>
    <text class="m" x="428" y="323" font-size="20" font-weight="700" fill="#60b9fc">GitHub, pinned</text>
    <g class="m" font-size="18" fill="#cdd6f4">
      <text x="420" y="358">copy-on-select <tspan fill="#7f849c">@ea2304a</tspan></text>
      <text x="420" y="386">Catppuccin <tspan fill="#7f849c">@b58f434 + sha256</tspan></text>
    </g>
  </g>
  <line x1="680" y1="300" x2="680" y2="254" stroke="#60b9fc" stroke-width="2.5" marker-end="url(#head-accent)"/>
  <text class="m" x="696" y="284" font-size="18" fill="#60b9fc">apply fetches: no license to copy</text>

  <!-- Side notes -->
  <g class="m" font-size="18" fill="#7f849c">
    <text x="48" y="330">copies, not links:</text>
    <text x="48" y="358">the app rewrites the</text>
    <text x="48" y="386">layout as you use it</text>
  </g>
  <g class="m" font-size="18" fill="#7f849c" text-anchor="end">
    <text x="1152" y="330">only files named in</text>
    <text x="1152" y="358">sync.sh are touched;</text>
    <text x="1152" y="386">other mods stay as is</text>
  </g>
</svg>
